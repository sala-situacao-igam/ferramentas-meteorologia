name: Dados do Curto Prazo (GFS e WRF, 24/48/72 h)

# Baixa a chuva prevista do GFS (NOAA/NCEP, NOMADS) e do WRF 7 km (CPTEC/INPE) só para
# a região de MG, na janela 09h–09h hora local (12Z–12Z), e grava um JSON com a mesma
# estrutura para cada modelo em curto-prazo/dados/<gfs|wrf>.json.
# Ferramenta nova e separada: não mexe nos dados de Reservatórios/Tendência.
# Só faz commit quando muda alguma coisa. Nada de senha ou chave.

on:
  schedule:
    - cron: "23 */2 * * *"   # a cada 2 horas (UTC), fora dos minutos do GFS (:47) e do CPC
  workflow_dispatch:
    inputs:
      reprocessar:
        description: "Refazer a rodada mais recente mesmo que já exista"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/dados-curto-prazo.yml"
      - "scripts/baixar_curto_prazo.py"

permissions:
  contents: write             # só para gravar o JSON no repositório

concurrency:
  group: dados-curto-prazo
  cancel-in-progress: false

jobs:
  baixar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # ação oficial do GitHub, fixada pelo commit (v4.2.2) para não mudar sem aviso
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Instalar o ecCodes (leitor de GRIB do ECMWF, pelo apt do Ubuntu)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libeccodes-tools
          grib_ls -V | head -2

      - name: Baixar e processar GFS e WRF
        env:
          REPROCESSAR: ${{ inputs.reprocessar && '1' || '0' }}
        run: python3 -I scripts/baixar_curto_prazo.py curto-prazo/dados

      - name: Gravar se mudou
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curto-prazo/dados
          if git diff --cached --quiet; then
            echo "Nada novo."
            exit 0
          fi
          git commit -m "Curto Prazo: dados atualizados ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
