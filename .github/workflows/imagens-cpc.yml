name: Imagens do CPC (Reservatórios e Tendência)

# Baixa as imagens públicas do CPC/NOAA (GFS Week 1/2, 24 h, 3 e 5 dias e
# probabilidade GEFS > 100 mm, ciclos 00Z e 06Z) e grava em reservatorios/cpc/.
# Só faz commit quando alguma imagem mudou.

on:
  schedule:
    - cron: "17 */2 * * *"   # a cada 2 horas (UTC)
  workflow_dispatch:          # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths:
      - ".github/workflows/imagens-cpc.yml"
      - "scripts/baixar_cpc.py"

permissions:
  contents: write

concurrency:
  group: imagens-cpc
  cancel-in-progress: false

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Baixar imagens do CPC
        run: python3 scripts/baixar_cpc.py reservatorios/cpc

      - name: Gravar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reservatorios/cpc
          if git diff --cached --quiet; then
            echo "Nenhuma imagem nova."
            exit 0
          fi
          git commit -m "Imagens do CPC atualizadas ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
